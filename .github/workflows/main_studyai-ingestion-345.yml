name: Build and deploy .NET project to Azure Function App - studyai-ingestion-345

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # Path to project root (update if your .csproj is in a subfolder)
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write   # Required for Azure OIDC login
      contents: read    # Required to read repo code

    steps:
      # Checkout your GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"

      # Build the project
      - name: Build project
        run: dotnet build "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" --configuration Release --no-restore

      # Publish the project to a folder for deployment
      - name: Publish project
        run: dotnet publish "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" --configuration Release --output ./publish_output --no-build

      # Login to Azure using OpenID Connect (Federated Credentials)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_52536EC2477D4CF2B9E3B9FE552C0037 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5CC827F7023F45C8907398490A0C45D4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_26FC5077ABF94CEBAD30BD70F0AE8965 }}

      # Deploy to Azure Function App
      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name: 'studyai-ingestion-345'
          slot-name: 'Production'
          package: './publish_output'
